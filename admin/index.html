<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Chambers Console | Nexora Law Firm</title>
  <script>
    // Check if admin is logged in
    try {
      const session = localStorage.getItem('nexora_firm_admin_session');
      if (session) {
        window.location.replace('../cases.html?session=admin');
      } else {
        window.location.replace('./login.html');
      }
    } catch (e) {
      window.location.replace('./login.html');
    }
  </script>
</head>
<body style="background-color: #0b0b0d; color: #d4af37; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <p>Connecting to Nexora Chambers Executive Console...</p>
</body>
</html>
