name: CI — Validate & Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Type & Code Linting
  # ─────────────────────────────────────────────
  validate-code:
    name: Type & Lint Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint & Type Check
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Dependency audit (production)
        run: npm run audit:prod

  # ─────────────────────────────────────────────
  # JOB 2: Security Scan
  # ─────────────────────────────────────────────
  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for potential hardcoded credentials..."
          if grep -rn "eyJ[A-Za-z0-9_-]\{30,\}" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" --exclude-dir="node_modules" --exclude-dir=".next" .; then
            echo "❌ Possible hardcoded JWT token found in source files!"
            exit 1
          else
            echo "✅ No hardcoded JWT tokens detected."
          fi

      - name: Verify .env is gitignored
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "❌ .env file is tracked by git — remove it immediately!"
            exit 1
          else
            echo "✅ .env is properly gitignored."
          fi

      - name: Run NPM Audit (Production Dependencies)
        run: npm audit --omit=dev --audit-level=high

  # ─────────────────────────────────────────────
  # JOB 3: Required Files Check
  # ─────────────────────────────────────────────
  required-files:
    name: Required Files Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required files exist
        run: |
          REQUIRED_FILES=(
            "README.md"
            "CHANGELOG.md"
            "AGENTS.md"
            "HowToSetup.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "LICENSE"
            ".env.example"
            "package.json"
            "vercel.json"
            "database/schema.sql"
            "database/seed.sql"
            "Dockerfile"
            "docker-compose.yml"
            "app/page.tsx"
            "app/cases/page.tsx"
            "app/admin/page.tsx"
            "app/admin/login/page.tsx"
          )
          MISSING=0
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f"
              MISSING=$((MISSING + 1))
            else
              echo "✅ Found: $f"
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo ""
            echo "❌ $MISSING required file(s) missing!"
            exit 1
          else
            echo ""
            echo "✅ All required files present."
          fi

  # ─────────────────────────────────────────────
  # JOB 4: Next.js Clean Build Validation
  # ─────────────────────────────────────────────
  build-nextjs:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & verify build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://your-project-id.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
        run: |
          # Generate throwaway runtime secrets dynamically per-run
          export SESSION_SECRET=$(openssl rand -base64 32)
          export SUPABASE_SERVICE_ROLE_KEY=$(openssl rand -base64 32)
          export ADMIN_DEFAULT_PASSWORD=$(openssl rand -base64 16)
          npm ci
          npm run build

